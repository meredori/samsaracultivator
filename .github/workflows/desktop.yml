name: Desktop builds

# Windows and Linux builds of the Tauri app. Feature PRs go into develop and
# skip this; only the release path develop -> main builds installers.
#   pull request into main (from develop) -> installers attached to the workflow run as artifacts
#   push to main (release merge)          -> prerelease "build-<run>" with the installers as release assets

on:
  # Skipped while the release PR is a draft; builds once it is ready for review.
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Samsara Cultivator $TAG" \
            --notes "Automated build of ${GITHUB_SHA::7} from main."
          echo "id=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: create-release
    # Runs on PRs too, where create-release is skipped.
    if: ${{ !cancelled() && needs.create-release.result != 'failure' && !github.event.pull_request.draft }}
    strategy:
      fail-fast: false
      matrix:
        # 22.04 keeps the AppImage/deb compatible with older glibc.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.create-release.outputs.id }}
          uploadWorkflowArtifacts: true
